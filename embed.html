<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="PaperFate embeddable quick-check widget — abstract rubric scoring for biomedical manuscripts." />
    <title>PaperFate — Embed</title>
    <style>
      /* Minimal styles for the embed. The widget targets dark-on-light blogs
         AND dark blogs, so we ship a self-contained light palette and rely on
         the parent iframe wrapper for sizing. No external font dependency. */
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      body { padding: 16px; }
      .pf-embed {
        max-width: 640px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      }
      .pf-embed__brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #f1f5f9;
      }
      .pf-embed__brand-link {
        font-weight: 700;
        color: #0f172a;
        text-decoration: none;
        font-size: 14px;
      }
      .pf-embed__brand-link:hover { text-decoration: underline; }
      .pf-embed__brand-tag {
        color: #64748b;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .pf-embed__form { display: flex; flex-direction: column; gap: 6px; }
      .pf-embed__label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #475569;
        margin-top: 6px;
      }
      .pf-embed__input,
      .pf-embed__textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 14px;
        font-family: inherit;
        color: #0f172a;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      .pf-embed__textarea {
        resize: vertical;
        min-height: 140px;
        line-height: 1.55;
      }
      .pf-embed__input:focus,
      .pf-embed__textarea:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }
      .pf-embed__counter {
        font-size: 11px;
        color: #64748b;
        margin-top: 2px;
      }
      .pf-embed__counter-warn { color: #b45309; }
      .pf-embed__btn {
        margin-top: 10px;
        align-self: flex-start;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        color: #ffffff;
        background: #4f46e5;
        border: 1px solid #4338ca;
        border-radius: 8px;
        cursor: pointer;
        transition: background 120ms ease, opacity 120ms ease;
      }
      .pf-embed__btn:hover:not(:disabled) { background: #4338ca; }
      .pf-embed__btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .pf-embed__alert {
        margin-top: 14px;
        padding: 10px 12px;
        font-size: 12px;
        color: #92400e;
        background: #fef3c7;
        border: 1px solid #fde68a;
        border-radius: 8px;
      }
      .pf-embed__result {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #f1f5f9;
      }
      .pf-embed__degraded {
        margin-bottom: 10px;
        padding: 8px 10px;
        font-size: 11px;
        color: #92400e;
        background: #fffbeb;
        border: 1px solid #fde68a;
        border-radius: 6px;
      }
      .pf-embed__score-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .pf-embed__score-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #475569;
        font-weight: 600;
      }
      .pf-embed__score-chip {
        font-size: 24px;
        font-weight: 700;
        color: #0f172a;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
        border-radius: 8px;
        padding: 4px 12px;
        font-variant-numeric: tabular-nums;
      }
      .pf-embed__score-suffix {
        font-size: 12px;
        font-weight: 500;
        color: #64748b;
      }
      .pf-embed__rollup {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .pf-embed__rollup-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        font-size: 12px;
        border: 1px solid;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.6);
      }
      .pf-embed__rollup-code { font-weight: 700; letter-spacing: 0.04em; }
      .pf-embed__rollup-name { color: #475569; font-size: 11px; }
      .pf-embed__rollup-score {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .pf-embed__footnote {
        margin-top: 6px;
        font-size: 11px;
        color: #64748b;
      }
      .pf-embed__footnote-link {
        color: #4f46e5;
        text-decoration: none;
      }
      .pf-embed__footnote-link:hover { text-decoration: underline; }

      @media (prefers-color-scheme: dark) {
        body { color: #e2e8f0; }
        .pf-embed {
          background: #0f172a;
          border-color: #1e293b;
          box-shadow: none;
        }
        .pf-embed__brand { border-bottom-color: #1e293b; }
        .pf-embed__brand-link { color: #f1f5f9; }
        .pf-embed__brand-tag { color: #94a3b8; }
        .pf-embed__label { color: #94a3b8; }
        .pf-embed__input,
        .pf-embed__textarea {
          color: #e2e8f0;
          background: #0b1220;
          border-color: #1e293b;
        }
        .pf-embed__counter { color: #94a3b8; }
        .pf-embed__counter-warn { color: #fbbf24; }
        .pf-embed__result { border-top-color: #1e293b; }
        .pf-embed__score-chip {
          color: #f1f5f9;
          background: rgba(99, 102, 241, 0.15);
          border-color: rgba(99, 102, 241, 0.4);
        }
        .pf-embed__score-suffix { color: #94a3b8; }
        .pf-embed__rollup-chip { background: rgba(15, 23, 42, 0.5); }
        .pf-embed__rollup-name { color: #94a3b8; }
        .pf-embed__footnote { color: #94a3b8; }
        .pf-embed__footnote-link { color: #a5b4fc; }
        .pf-embed__alert {
          color: #fcd34d;
          background: rgba(120, 53, 15, 0.25);
          border-color: rgba(251, 191, 36, 0.4);
        }
        .pf-embed__degraded {
          color: #fcd34d;
          background: rgba(120, 53, 15, 0.2);
          border-color: rgba(251, 191, 36, 0.35);
        }
      }
    </style>
  </head>
  <body>
    <div id="pf-embed-root"></div>
    <script type="module" src="/src/embed/main-embed.jsx"></script>
  </body>
</html>
