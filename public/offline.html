<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline — PaperFate</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.5;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e2e8f0;
        }
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 32px 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.6);
      }
      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(30, 41, 59, 0.6);
        }
      }
      .logo {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0 0 4px 0;
      }
      .logo span {
        color: #2563eb;
      }
      .tagline {
        font-size: 13px;
        opacity: 0.7;
        margin: 0 0 24px 0;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 12px 0;
        font-weight: 600;
      }
      p {
        font-size: 14px;
        margin: 0 0 24px 0;
        opacity: 0.85;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        min-height: 44px;
        min-width: 120px;
      }
      button:hover {
        background: #1d4ed8;
      }
      button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="logo">Paper<span>Fate</span></p>
      <p class="tagline">paperfate.com</p>
      <h1>You are offline</h1>
      <p>PaperFate is offline. Please check your connection and retry.</p>
      <button type="button" onclick="location.reload()">Reload</button>
    </main>
  </body>
</html>
