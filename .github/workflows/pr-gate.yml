name: PR gate

on:
  pull_request:
    branches: [main]

jobs:
  pr-gate:
    name: pre-push-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run pre-push gate
        run: node scripts/pre-push-gate.mjs
