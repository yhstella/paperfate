name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run production smoke (quick)
        run: node scripts/smoke-production-v2.mjs --quick
